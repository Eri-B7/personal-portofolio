<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${pageTitle})}"></head>
<body>
<main class="container narrow login-page">
    <h1>Admin Login</h1>
    <p class="muted">Hyr këtu për të ndryshuar vetë përmbajtjen e faqes.</p>

    <div class="alert success">
        <strong>Kredencialet:</strong><br>
        Username: <code>admin</code><br>
        Password: <code>changeMe123</code>
    </div>

    <div th:if="${param.error}" class="alert error">
        Username ose password i gabuar. Përdor saktësisht <code>admin</code> dhe <code>changeMe123</code> (jo emrin tënd).
    </div>
    <div th:if="${param.logout}" class="alert success">U çkyçe me sukses.</div>

    <form th:action="@{/login}" method="post" class="form">
        <label>
            Username
            <input type="text" name="username" value="admin" required autofocus autocomplete="username">
        </label>
        <label>
            Password
            <input type="password" name="password" value="changeMe123" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn primary">Hyr në panel</button>
    </form>
    <p><a th:href="@{/}">← Kthehu te faqja publike</a></p>
</main>
</body>
</html>
