<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${pageTitle})}"></head>
<body class="admin-body">
<header th:replace="~{fragments :: header('admin')}"></header>
<main class="container admin-layout">
    <aside th:replace="~{fragments :: admin-nav(${activePage})}"></aside>
    <section>
        <h1>Certifikimet</h1>
        <p class="muted">Shto certifikata (p.sh. programim) që shfaqen te faqja <strong>About</strong>.</p>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <form th:action="@{/admin/certifications}" th:object="${certificationForm}" method="post" class="form panel">
            <h2 th:text="${editing} ? 'Ndrysho certifikatën' : 'Shto certifikatë të re'">Shto certifikatë</h2>
            <input type="hidden" th:if="*{id != null}" th:field="*{id}">
            <label>Titulli <input type="text" th:field="*{title}" required placeholder="p.sh. Certifikatë Programimi"></label>
            <label>Lëshuesi <input type="text" th:field="*{issuer}" placeholder="p.sh. Coursera, Cisco, ..."></label>
            <label>Viti <input type="text" th:field="*{yearObtained}"></label>
            <label>Përshkrimi <textarea th:field="*{description}" rows="3"></textarea></label>
            <label>Link i kredencialit (opsionale) <input type="url" th:field="*{credentialUrl}" placeholder="https://..."></label>
            <label>Renditja <input type="number" th:field="*{sortOrder}"></label>
            <div class="actions">
                <button type="submit" class="btn primary" th:text="${editing} ? 'Ruaj ndryshimet' : 'Shto'">Shto</button>
                <a th:if="${editing}" class="btn ghost" th:href="@{/admin/certifications}">Anulo</a>
            </div>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Titulli</th>
                    <th>Lëshuesi</th>
                    <th>Viti</th>
                    <th>Veprime</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${certifications}">
                    <td th:text="${c.title}">Title</td>
                    <td th:text="${c.issuer}">Issuer</td>
                    <td th:text="${c.yearObtained}">Year</td>
                    <td class="row-actions">
                        <a class="btn ghost small" th:href="@{/admin/certifications/{id}/edit(id=${c.id})}">Ndrysho</a>
                        <form th:action="@{/admin/certifications/{id}/delete(id=${c.id})}" method="post">
                            <button type="submit" class="btn danger small"
                                    onclick="return confirm('Fshi këtë certifikatë?')">Fshi</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(certifications)}" class="muted">Nuk ke shtuar ende asnjë certifikatë.</p>
        </div>
    </section>
</main>
</body>
</html>
